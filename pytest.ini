[pytest]
strict = true
testpaths = tests
markers =
    virtual: Tests with virtual drive
    ethernet: Ethernet tests
    ethercat: EtherCAT tests
    eoe: EtherCAT service tests
    canopen: CANopen tests
    multislave: EtherCAT tests that require multiple slaves
    no_pcap: Test for environments without libpcap/WinPcap/Npcap installed
    pcap: Test for environments that only require libpcap/WinPcap/Npcap installed but no real ethercat network
    fsoe: Safety over EtherCAT
    valid_versions_for_product: Specify valid firmware version range for a specific product (part_number, min=version, max=version)
    not_valid_for_product: Specify part number for which the test should never run
    valid_versions_for_standard_products: Specify valid firmware version range for all standard products (min=version, max=version)
    valid_versions_for_standard_comocos: Specify valid firmware version range for all CoMoCo products (min=version, max=version)
    valid_versions_for_standard_cocomoco: Specify valid firmware version range for all CoCoMoCo products (min=version, max=version)
    not_valid_for_standard_products: Specify that the test should never run for any standard product
    not_valid_for_standard_comocos: Specify that the test should never run for any CoMoCo product
    not_valid_for_standard_cocomoco: Specify that the test should never run for any CoCoMoCo product
log_cli = False
log_cli_level = INFO
env=
    D:TESTS_OUTPUT_DIR=tests/outputs
    D:RESOURCES_DIR=resources
    D:WIRESHARK_DIR=wireshark
    D:WIRESHARK_INSTALLATION_PATH=C:\\Program Files\\Wireshark
    D:START_WIRESHARK_TIMEOUT_S=10.0